<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시은이 아침">
<meta name="theme-color" content="#fdf6e3">
<title>시은이 아침 퀘스트</title>
<link rel="icon" href="assets/avatar-sieun.png">
<link rel="apple-touch-icon" href="assets/avatar-sieun.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="stage" id="stage">

  <!-- ================= 상단: 날짜 · 시계 · 날씨 ================= -->
  <header class="topbar">
    <div class="date-block">
      <span class="brand">🐻 시은이 아침</span>
      <div class="date-line">
        <strong id="date-main">11월 20일</strong>
        <span id="date-day">금요일</span>
      </div>
    </div>

    <div class="clock-panel">
      <div class="clock" aria-label="현재 시각">
        <span class="ampm" id="ampm">오전</span>
        <span class="time" id="time-text">08:09</span>
      </div>
    </div>

    <aside class="weather" aria-label="오늘과 이번 주 날씨">
      <div class="weather-head">
        <span class="dust" id="dust"><i class="dust-dot"></i><span>미세먼지 <b>—</b></span></span>
        <button class="sound-btn" id="btn-sound" type="button" aria-label="효과음 켜기/끄기">🔊</button>
      </div>
      <div class="week-strip" id="week-strip"></div>
      <p class="tip" id="tip">날씨를 불러오는 중이에요…</p>
    </aside>
  </header>

  <!-- ================= 중단: 출발까지 남은 시간 + 게이지 ================= -->
  <section class="status" aria-label="유치원 출발까지 남은 시간">
    <div class="progress">
      <div class="progress-line">
        <span class="progress-label">유치원 출발까지</span>
        <strong class="progress-time" id="mins">--분 남았어요</strong>
      </div>
      <div class="gauge-row">
        <div class="gauge-track">
          <div class="gauge-fill" id="gauge-fill" style="--p:0"></div>
          <img class="gauge-face" id="gauge-face" src="assets/avatar-sieun.png" alt="" style="--p:0">
        </div>
        <div class="gauge-bubble" id="gauge-bubble">3개 남았어! 힘내!</div>
      </div>
    </div>
    <div class="depart">
      <span class="depart-label">출발</span>
      <strong class="depart-time" id="depart-time">오전 8:30</strong>
      <span class="depart-icon" aria-hidden="true">🏫</span>
    </div>
  </section>

  <!-- ================= 주간 스탬프 + 토요일 보물상자 ================= -->
  <section class="week-panel" aria-label="이번 주 진행">
    <div class="week-days" id="week-days"></div>
    <p class="week-caption" id="week-caption">이번 주도 힘내!</p>
  </section>

  <!-- ================= 하단: 오늘의 퀘스트 3개 ================= -->
  <section class="quests" id="quests" aria-label="오늘의 아침 퀘스트"></section>

</main>

<!-- ================= 설정 ================= -->
<div class="overlay" id="settings-overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="설정">
    <div class="sheet-head">
      <h2>⚙️ 설정</h2>
      <button class="icon-btn" id="settings-close" type="button" aria-label="닫기">✕</button>
    </div>

    <label class="row">
      <span class="row-label">유치원 출발 시각</span>
      <input type="time" id="dep-input" value="08:30" step="60">
    </label>

    <div class="row">
      <span class="row-label">효과음</span>
      <button class="toggle" id="mute-toggle" type="button" aria-pressed="true">켜짐 🔊</button>
    </div>

    <div class="row col">
      <span class="row-label">주간 보물상자 (월~금 모두 완료하면 토요일에 열려요)</span>
      <button class="btn btn-gold" id="preview-btn" type="button">🎁 토요일 보물상자 미리보기</button>
      <button class="btn btn-ghost" id="reset-week" type="button">🧹 이번 주 기록 초기화</button>
    </div>

    <p class="sync-note" id="sync-note">☁️ 가족과 연결 확인 중…</p>
  </div>
</div>

<!-- ================= 토요일 보물상자 ================= -->
<div class="overlay treasure-overlay" id="treasure-overlay" hidden>
  <div class="treasure-inner" role="dialog" aria-modal="true" aria-label="토요일 보물상자">
    <p class="t-kicker" id="t-kicker">토요일 아침이야!</p>
    <h2 class="t-title" id="t-title">보물상자가 도착했어요!</h2>

    <button class="box" id="box" type="button" aria-label="보물상자 열기">
      <span class="box-lid">
        <span class="box-lid-ribbon"></span>
        <span class="box-bow"><i></i><i></i><b></b></span>
      </span>
      <span class="box-body"><span class="box-ribbon"></span></span>
      <span class="box-glow" aria-hidden="true"></span>
    </button>

    <p class="t-hint" id="t-hint">상자를 콕 터치해서 열어봐!</p>

    <div class="reward" id="reward" hidden>
      <span class="reward-emoji" id="reward-emoji">🎮</span>
      <strong class="reward-label" id="reward-label">게임 30분 이용권</strong>
      <span class="reward-sub" id="reward-sub">토요일 아침 보상이에요!</span>
      <button class="btn btn-gold" id="reward-ok" type="button">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
