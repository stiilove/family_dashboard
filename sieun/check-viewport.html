<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>viewport check (임시)</title>
<style>
  html, body { margin: 0; background: #1d1d1f; color: #e8e8e8; font: 12px/1.45 "SFMono-Regular", Menlo, monospace; }
  #log { padding: 8px 12px; white-space: pre-wrap; max-height: 170px; overflow: auto; border-bottom: 1px solid #333; }
  iframe { display: block; border: 0; background: #fff; }
</style>
</head>
<body>
<div id="log">loading…</div>
<iframe id="f" width="1180" height="820" src="about:blank"></iframe>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var W = parseInt(q.get('w') || '1180', 10);
  var H = parseInt(q.get('h') || '820', 10);
  var FIX = q.get('fix') || '';
  var SEED = q.get('seed') || '';
  var f = document.getElementById('f');
  f.width = W; f.height = H;
  f.style.width = W + 'px'; f.style.height = H + 'px';

  var BASE = 'https://stiilove.github.io/family_dashboard/sieun/';
  var V = '?v=' + Date.now();
  var errs = [];
  var log = document.getElementById('log');
  function show(extra) { log.textContent = 'size ' + W + 'x' + H + ' fix=' + (FIX || '-') + ' seed=' + (SEED || '-') + '\n' + extra; }
  show('loading…');

  // ---- 테스트용 주간 기록 시드 ----
  var seedJson = '';
  if (SEED === 'week' || SEED === 'week4') {
    var base = FIX ? new Date(FIX) : new Date();
    var monday = new Date(base.getFullYear(), base.getMonth(), base.getDate());
    monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
    var days = {};
    var upto = SEED === 'week4' ? 4 : 5;
    for (var i = 0; i < upto; i++) {
      var d = new Date(monday.getTime());
      d.setDate(d.getDate() + i);
      var k = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
      days[k] = { brush: true, wash: true, dress: true };
    }
    seedJson = JSON.stringify({ v: 1, departure: '08:30', muted: true, days: days, rewards: {}, updatedAt: Date.now() });
  }

  function measure() {
    var d = f.contentDocument, w = f.contentWindow;
    if (!d) { show('no doc'); return; }
    try { measureInner(d, w); } catch (err) { show('measure error: ' + err.message + '\n' + 'errors=' + (errs.length ? errs.join(' / ') : 'none')); }
  }
  function measureInner(d, w) {
    var out = [];
    var qs = d.querySelectorAll('.quest');
    out.push('docH=' + d.documentElement.scrollHeight + ' (clientH=' + d.documentElement.clientHeight + ')');
    out.push('body ' + d.body.scrollHeight + 'x' + d.body.scrollWidth + ' clientW=' + d.documentElement.clientWidth);
    out.push('quests=' + qs.length + ' card=' + Math.round(qs[0].getBoundingClientRect().width) + 'x' + Math.round(qs[0].getBoundingClientRect().height));
    out.push('clock=' + d.querySelector('#time-text').textContent + ' ' + d.querySelector('#ampm').textContent);
    out.push('mins=' + d.querySelector('#mins').textContent);
    out.push('gauge=' + d.querySelector('#gauge-fill').style.getPropertyValue('--p') + ' bubble=' + d.querySelector('#gauge-bubble').textContent);
    out.push('done cards=' + d.querySelectorAll('.quest.done').length + ' next=' + (d.querySelector('.quest.next') ? d.querySelector('.quest.next').dataset.id : '-'));
    out.push('week=' + Array.prototype.map.call(d.querySelectorAll('.wday'), function (x) { return x.className.replace('wday ', '') + ':' + x.textContent; }).join(' | '));
    out.push('caption=' + d.querySelector('#week-caption').textContent);
    out.push('treasure open=' + !d.querySelector('#treasure-overlay').hidden + ' reward=' + !d.querySelector('#reward').hidden);
    out.push('imgs=' + Array.prototype.map.call(d.images, function (im) { return (im.getAttribute('src') || '').split('/').pop() + ':' + im.naturalWidth; }).join(','));
    var bad = w.performance.getEntriesByType('resource').filter(function (r) { return r.responseStatus >= 400; });
    out.push('badRes=' + (bad.length ? bad.map(function (b) { return b.name.split('/').pop(); }).join(' ') : 'none'));
    out.push('errors=' + (errs.length ? errs.join(' / ') : 'none'));
    show(out.join('\n'));
  }
  window.__measure = measure;

  window.addEventListener('message', function (e) { if (e.data && e.data.t === 'err') errs.push(e.data.m); });

  fetch(BASE + V).then(function (r) { return r.text(); }).then(function (html) {
    html = html.replace('href="styles.css"', 'href="styles.css' + V + '"').replace('src="app.js"', 'src="app.js' + V + '"');

    var inject = '<base href="' + BASE + '"><script>' +
      'window.addEventListener("error",function(e){parent.postMessage({t:"err",m:(e.message||"")+" | "+(e.filename||"")+":"+(e.lineno||"")},"*")});' +
      'window.addEventListener("unhandledrejection",function(e){parent.postMessage({t:"err",m:"unhandled "+e.reason},"*")});' +
      'try{localStorage.removeItem("sieunMorning.v1");' + (seedJson ? 'localStorage.setItem("sieunMorning.v1",' + JSON.stringify(seedJson) + ');' : '') + '}catch(e){}' +
      'var _f=window.fetch;window.fetch=function(u,o){var s=String(u&&u.url?u.url:u);if(s.indexOf("firebasedatabase.app")>-1)return Promise.reject(new Error("blocked in check page"));return _f.apply(this,arguments)};' +
      (FIX ? '(function(){var R=Date,T=new R("' + FIX + '").getTime();function F(){var a=[].slice.call(arguments);if(!a.length)return new R(T);return new (Function.prototype.bind.apply(R,[null].concat(a)))();}F.now=function(){return T};F.prototype=R.prototype;F.parse=R.parse;F.UTC=R.UTC;window.Date=F;})();' : '') +
      '<\/script>';

    f.srcdoc = html.replace('<head>', '<head>' + inject);
    var tries = 0;
    var poll = setInterval(function () {
      tries++;
      try { if (f.contentDocument && f.contentDocument.querySelector('#time-text')) { clearInterval(poll); setTimeout(measure, 1800); } } catch (e) { }
      if (tries > 40) clearInterval(poll);
    }, 200);
  }).catch(function (e) { show('fetch failed ' + e); });
})();
</script>
</body>
</html>
